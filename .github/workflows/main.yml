name: Build PiliPlus APK

on:
  schedule:
    - cron: '0 0 * * *'
  workflow_dispatch:

env:
  SOURCE_REPO: bggRGjQaUbCoE/PiliPlus
  TARGET_REPO: lm317379829/build-Pili
  APP_NAME: 哔哩哔哩
  KEEP_COUNT: 3

jobs:
  check-and-build:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      actions: write

    steps:
      - name: 检出本仓库
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: 获取 PiliPlus 最新 commit SHA
        id: get-latest
        run: |
          LATEST_SHA=$(curl -s "https://api.github.com/repos/${{ env.SOURCE_REPO }}/commits/main" | jq -r '.sha')
          echo "sha=$LATEST_SHA" >> $GITHUB_OUTPUT
          echo "最新 commit SHA: $LATEST_SHA"

      - name: 检查是否需要构建
        id: check-update
        run: |
          if [ -f .last_build_sha ]; then
            LAST_SHA=$(cat .last_build_sha)
            echo "上次构建的 SHA: $LAST_SHA"
            if [ "$LAST_SHA" = "${{ steps.get-latest.outputs.sha }}" ]; then
              echo "没有检测到更新，跳过构建"
              echo "need_build=false" >> $GITHUB_OUTPUT
            else
              echo "检测到更新！"
              echo "need_build=true" >> $GITHUB_OUTPUT
            fi
          else
            echo "首次构建"
            echo "need_build=true" >> $GITHUB_OUTPUT
          fi

      - name: 检出 PiliPlus 源码
        if: steps.check-update.outputs.need_build == 'true'
        uses: actions/checkout@v4
        with:
          repository: ${{ env.SOURCE_REPO }}
          path: pilipalus-source
          fetch-depth: 0

      - name: 设置 Java 环境
        if: steps.check-update.outputs.need_build == 'true'
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'
          cache: 'gradle'
          cache-dependency-path: |
            pilipalus-source/android/*.gradle*
            pilipalus-source/android/**/gradle-wrapper.properties

      - name: 安装 Flutter
        if: steps.check-update.outputs.need_build == 'true'
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          flutter-version-file: 'pilipalus-source/pubspec.yaml'
          cache: true

      - name: 应用上游 SDK 补丁 (patch.ps1)
        if: steps.check-update.outputs.need_build == 'true'
        shell: bash
        run: |
          # GITHUB_WORKSPACE 属系统变量不可被 env 覆盖，故将补丁文件复制到 workspace 根目录 lib/scripts 下，
          # 使 patch.ps1 内的 $GITHUB_WORKSPACE/lib/scripts/*.patch 路径可解析
          mkdir -p lib/scripts
          cp pilipalus-source/lib/scripts/*.patch lib/scripts/
          pwsh pilipalus-source/lib/scripts/patch.ps1 android

      - name: 安装 ImageMagick
        if: steps.check-update.outputs.need_build == 'true'
        run: sudo apt-get update && sudo apt-get install -y imagemagick

      - name: 复制自定义图标并生成所有分辨率图标
        if: steps.check-update.outputs.need_build == 'true'
        run: |
          if [ -f "assets/icon.png" ]; then
            echo "找到自定义图标，正在处理..."
            
            # 创建 drawable 目录（代替 drawable-v21，通用性最强）
            mkdir -p pilipalus-source/android/app/src/main/res/drawable
            
            # 创建 mipmap 目录
            for density in mdpi hdpi xhdpi xxhdpi xxxhdpi; do
              mkdir -p "pilipalus-source/android/app/src/main/res/mipmap-$density"
            done
            
            # 图标尺寸映射
            declare -A SIZES=( ["mdpi"]=48 ["hdpi"]=72 ["xhdpi"]=96 ["xxhdpi"]=144 ["xxxhdpi"]=192 )
            
            # 生成 mipmap 图标（填充纯白底色，消除安装器中的黑底）
            for density in "${!SIZES[@]}"; do
              size="${SIZES[$density]}"
              convert assets/icon.png -resize ${size}x${size} -background white -alpha remove -flatten "pilipalus-source/android/app/src/main/res/mipmap-$density/ic_launcher.png"
              echo "生成 mipmap-$density/ic_launcher.png (${size}x${size}, 纯白背景底)"
            done
            
            # 生成自适应图标背景（设为 100% 纯透明，确保桌面图标为完美的透明底）
            convert -size 288x288 xc:transparent pilipalus-source/android/app/src/main/res/drawable/ic_launcher_background.png
            echo "生成 drawable/ic_launcher_background.png (288x288, 100% 纯透明背景图)"
            
            # 生成自适应前景图标（216px/73% 平衡填充圆形裁剪区与呼吸感）
            convert assets/icon.png -resize 216x216 -background transparent -gravity center -extent 288x288 \
              pilipalus-source/android/app/src/main/res/drawable/ic_launcher_foreground.png
            echo "生成 drawable/ic_launcher_foreground.png (288x288, 216px 主体)"
            # 物理清理所有与生成的 PNG 冲突的旧同名 XML 资源文件，防止 Gradle 资源合并 Duplicate resources 报错
            find pilipalus-source/android/app/src/main/res/ -name "ic_launcher_background.xml" -delete
            find pilipalus-source/android/app/src/main/res/ -name "ic_launcher_foreground.xml" -delete
            echo "✅ 已物理清理冲突的同名 XML 自适应图标层定义文件"
            
            # 修改自适应图标 XML 文件，将背景指向刚生成的 drawable 图片，而非颜色
            XML_FILE="pilipalus-source/android/app/src/main/res/mipmap-anydpi-v26/ic_launcher.xml"
            if [ -f "$XML_FILE" ]; then
              sed -i 's|@color/ic_launcher_background|@drawable/ic_launcher_background|g' "$XML_FILE"
              echo "✅ 已修改 $XML_FILE 中的背景为 drawable"
            fi
            
            # 复制到 assets/logo 目录
            cp assets/icon.png pilipalus-source/assets/images/logo/logo_2.png
            cp assets/icon.png pilipalus-source/assets/images/logo/logo.png
            
            echo "✅ 图标处理完成"
          else
            echo "⚠️ 警告: 未找到自定义图标 assets/icon.png，将使用默认图标"
          fi

      - name: 配置启动界面白色背景
        if: steps.check-update.outputs.need_build == 'true'
        run: |
          RES_DIR="pilipalus-source/android/app/src/main/res"
          
          # 覆写 launch_background.xml 为纯白色（修复启动界面黑底，适用于 Android 12 以下）
          for dir in "$RES_DIR/drawable" "$RES_DIR/drawable-v21"; do
            mkdir -p "$dir"
            cat > "$dir/launch_background.xml" << 'XMLEOF'
          <?xml version="1.0" encoding="utf-8"?>
          <layer-list xmlns:android="http://schemas.android.com/apk/res/android">
              <item android:drawable="@android:color/white" />
          </layer-list>
          XMLEOF
            echo "✅ 已设置 $dir/launch_background.xml 为白色背景"
          done
          
          # 为 Android 12+ 注入 SplashScreen 白色背景属性
          STYLES_FILE="$RES_DIR/values/styles.xml"
          if [ -f "$STYLES_FILE" ]; then
            if ! grep -q "windowSplashScreenBackground" "$STYLES_FILE"; then
              sed -i '/<style.*LaunchTheme/,/<\/style>/ {
                /<\/style>/ i\        <item name="android:windowSplashScreenBackground">@android:color/white</item>
              }' "$STYLES_FILE"
              echo "✅ 已向 styles.xml 注入 Android 12+ SplashScreen 白色背景"
            fi
          fi
          
          # 同样处理夜间模式的 styles.xml
          STYLES_NIGHT="$RES_DIR/values-night/styles.xml"
          if [ -f "$STYLES_NIGHT" ]; then
            if ! grep -q "windowSplashScreenBackground" "$STYLES_NIGHT"; then
              sed -i '/<style.*LaunchTheme/,/<\/style>/ {
                /<\/style>/ i\        <item name="android:windowSplashScreenBackground">@android:color/white</item>
              }' "$STYLES_NIGHT"
              echo "✅ 已向 values-night/styles.xml 注入 Android 12+ SplashScreen 白色背景"
            fi
          fi
          
          echo "✅ 启动界面白色背景配置完成"

      - name: 修改应用名称
        if: steps.check-update.outputs.need_build == 'true'
        run: |
          STRINGS_FILE="pilipalus-source/android/app/src/main/res/values/string.xml"
          mkdir -p "$(dirname "$STRINGS_FILE")"
          cat > "$STRINGS_FILE" << 'XMLEOF'
          <?xml version="1.0" encoding="utf-8"?>
          <resources>
              <string name="app_name">哔哩哔哩</string>
              <string name="search">搜索</string>
              <string name="offline_video">离线视频</string>
          </resources>
          XMLEOF
          echo "✅ 应用名称已修改为: ${{ env.APP_NAME }}"

      - name: 修改更新检查链接指向本仓库
        if: steps.check-update.outputs.need_build == 'true'
        run: |
          echo "修改更新检查 API 指向本仓库..."
          
          # 修改 api.dart 中的 latestApp URL
          sed -i "s|https://api.github.com/repos/bggRGjQaUbCoE/PiliPlus/releases|https://api.github.com/repos/${{ env.TARGET_REPO }}/releases|g" \
            pilipalus-source/lib/http/api.dart
          
          # 验证修改
          grep "latestApp" pilipalus-source/lib/http/api.dart
          echo "✅ 更新检查 API 已修改"

      - name: 获取版本信息
        if: steps.check-update.outputs.need_build == 'true'
        id: version
        run: |
          cd pilipalus-source
          VERSION=$(grep '^version:' pubspec.yaml | sed 's/version: //' | cut -d'+' -f1 | tr -d '\r' | tr -d ' ')
          VERSION_CODE=$(grep '^version:' pubspec.yaml | sed 's/version: //' | cut -d'+' -f2 | tr -d '\r' | tr -d ' ')
          BUILD_DATE=$(date +%Y%m%d)
          TAG_NAME="v${VERSION}"
          echo "version=$VERSION" >> $GITHUB_OUTPUT
          echo "version_code=$VERSION_CODE" >> $GITHUB_OUTPUT
          echo "tag_name=$TAG_NAME" >> $GITHUB_OUTPUT
          echo "build_date=$BUILD_DATE" >> $GITHUB_OUTPUT
          echo "版本: $VERSION | 标签: $TAG_NAME"

      - name: 配置编译版本与 Commit Hash 信息
        if: steps.check-update.outputs.need_build == 'true'
        run: |
          BUILD_TIME_MS=$(date +%s)
          cat > pilipalus-source/lib/build_config.dart << EOF
          abstract final class BuildConfig {
            static const int versionCode = ${{ steps.version.outputs.version_code }};
            static const String versionName = '${{ steps.version.outputs.version }}';
            static const int buildTime = $BUILD_TIME_MS;
            static const String commitHash = '${{ steps.get-latest.outputs.sha }}';
          }
          EOF
          echo "✅ build_config.dart 注入成功，时间戳: $BUILD_TIME_MS，Hash: ${{ steps.get-latest.outputs.sha }}"
          cat pilipalus-source/lib/build_config.dart

      - name: 初始化并固化永久数字证书
        if: steps.check-update.outputs.need_build == 'true'
        run: |
          echo "检查本地 Git 仓库中是否存在固定的签名文件..."
          
          # 1. 如果仓库中没有 release.jks，现场用 keytool 自动生成一颗永久证书，并静默 push 提交回仓库中
          if [ ! -f "release.jks" ]; then
            echo "⚠️ 未在仓库中发现固定签名 release.jks，正在首次生成..."
            keytool -genkey -v -keystore release.jks \
              -alias pili-key-alias -keyalg RSA -keysize 2048 -validity 20000 \
              -storepass "pili_secure_password_123" -keypass "pili_secure_password_123" \
              -dname "CN=PiliPlus, OU=Build, O=PiliPlusBuild, L=Guangzhou, S=Guangdong, C=CN"
            
            echo "✅ 证书首次生成成功，正在自动持久化提交至您的 GitHub 仓库..."
            git config user.name "github-actions[bot]"
            git config user.email "github-actions[bot]@users.noreply.github.com"
            git add release.jks
            git commit -m "chore: persist static release keystore for reproducible signing [skip ci]"
            git push origin main || echo "⚠️ 证书推送回远端失败，可能权限不足，但不影响本次构建。"
          else
            echo "✅ 在仓库中发现固定的永久签名 release.jks，无限复用此证书！"
          fi
          
          # 2. 将此永久签名拷贝至安卓工程对应的发布目录下，便于后续 apksigner 使用
          mkdir -p pilipalus-source/android/app
          cp release.jks pilipalus-source/android/app/release.jks

      - name: 安装依赖
        if: steps.check-update.outputs.need_build == 'true'
        run: |
          cd pilipalus-source
          flutter pub get

      - name: 构建 APK (arm64-v8a)
        if: steps.check-update.outputs.need_build == 'true'
        run: |
          cd pilipalus-source
          flutter build apk --release --split-per-abi --target-platform android-arm64
          APK_NAME="${{ env.APP_NAME }}_${{ steps.version.outputs.tag_name }}_arm64-v8a.apk"
          mv build/app/outputs/flutter-apk/app-arm64-v8a-release.apk "$APK_NAME"
          
          echo "🛡️ 正在定位系统中的 apksigner 工具..."
          # 优先使用 ANDROID_HOME 环境变量动态搜寻最新版 apksigner，确保 100% 兼容不同版本的 Actions Runner 容器
          APKSIGNER=$(find $ANDROID_HOME/build-tools -name "apksigner" | sort -V | tail -n 1)
          if [ -z "$APKSIGNER" ]; then
            echo "⚠️ 未在 ANDROID_HOME ($ANDROID_HOME) 中直接定位到 apksigner，尝试全局深搜..."
            APKSIGNER=$(which apksigner || find /usr -name "apksigner" 2>/dev/null | head -n 1)
          fi
          
          if [ -n "$APKSIGNER" ]; then
            echo "✅ 成功找到 apksigner 工具，物理路径: $APKSIGNER"
            echo "🛡️ 正在使用自持久化证书 release.jks 对 APK 进行 100% 强制二次覆写签名..."
            "$APKSIGNER" sign --ks android/app/release.jks \
              --ks-key-alias pili-key-alias \
              --ks-pass pass:pili_secure_password_123 \
              --key-pass pass:pili_secure_password_123 \
              "$APK_NAME"
            echo "✅ APK 固化签名圆满完成！"
          else
            echo "❌ 致命错误: 系统中未能定位到 apksigner 工具，无法完成安全签名加密！"
            exit 1
          fi
          
          echo "✅ APK 构建与签名完整流程圆满收官: $APK_NAME"
          ls -lh "$APK_NAME"

      - name: 发布 Release
        if: steps.check-update.outputs.need_build == 'true' && success()
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.version.outputs.tag_name }}
          name: "${{ env.APP_NAME }} ${{ steps.version.outputs.tag_name }}"
          body: |
            ## 📱 构建信息

            | 项目 | 值 |
            |------|-----|
            | 源仓库 | ${{ env.SOURCE_REPO }} |
            | Commit | `${{ steps.get-latest.outputs.sha }}` |
            | 构建日期 | ${{ steps.version.outputs.build_date }} |
            | 应用名称 | ${{ env.APP_NAME }} |
            | 架构 | arm64-v8a |

            ## 📝 说明

            基于 [PiliPlus](${{ env.SOURCE_REPO }}) 最新版本构建，包含：
            - ✅ 自定义应用图标
            - ✅ 自定义应用名称：${{ env.APP_NAME }}
            - ✅ 仅 arm64-v8a 架构（适用于大多数现代 Android 设备）
            - ✅ 更新检查指向本仓库
          files: |
            pilipalus-source/${{ env.APP_NAME }}_${{ steps.version.outputs.tag_name }}_arm64-v8a.apk
          draft: false
          prerelease: false

      - name: 清理旧 Release
        if: steps.check-update.outputs.need_build == 'true' && success()
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          echo "开始清理旧 Release，保留最近 ${{ env.KEEP_COUNT }} 个..."
          RELEASES=$(curl -s -H "Authorization: token ${{ secrets.GITHUB_TOKEN }}" \
            "https://api.github.com/repos/${{ github.repository }}/releases" \
            | jq -r '.[].tag_name')
          COUNT=0
          for tag in $RELEASES; do
            COUNT=$((COUNT + 1))
            if [ $COUNT -gt ${{ env.KEEP_COUNT }} ]; then
              echo "删除旧 Release: $tag"
              curl -s -X DELETE \
                -H "Authorization: token ${{ secrets.GITHUB_TOKEN }}" \
                "https://api.github.com/repos/${{ github.repository }}/releases/tags/$tag"
              echo "删除旧 Tag: $tag"
              curl -s -X DELETE \
                -H "Authorization: token ${{ secrets.GITHUB_TOKEN }}" \
                "https://api.github.com/repos/${{ github.repository }}/git/refs/tags/$tag"
            fi
          done
          echo "✅ Release 清理完成"

      - name: 清理旧 Action Run
        if: steps.check-update.outputs.need_build == 'true' && success()
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          echo "开始清理旧 Action Run，保留最近 ${{ env.KEEP_COUNT }} 个..."
          RESPONSE=$(curl -s -H "Authorization: token ${{ secrets.GITHUB_TOKEN }}" \
            "https://api.github.com/repos/${{ github.repository }}/actions/workflows/main.yml/runs?per_page=100")
          
          # 防御性安全校验，防止接口返回空值或报错阻断构建流
          if echo "$RESPONSE" | jq -e '.workflow_runs' >/dev/null 2>&1; then
            RUNS=$(echo "$RESPONSE" | jq -r '.workflow_runs[] | select(.status == "completed") | .id')
            COUNT=0
            for run_id in $RUNS; do
              COUNT=$((COUNT + 1))
              if [ $COUNT -gt ${{ env.KEEP_COUNT }} ]; then
                echo "删除旧 Action Run: $run_id"
                curl -s -X DELETE \
                  -H "Authorization: token ${{ secrets.GITHUB_TOKEN }}" \
                  "https://api.github.com/repos/${{ github.repository }}/actions/runs/$run_id"
              fi
            done
          else
            echo "⚠️ 警告: 无法获取 Action Runs 列表或格式有误，跳过本轮清理以确保安全构建"
          fi
          echo "✅ Action Run 清理完成"

      - name: 更新构建记录
        if: steps.check-update.outputs.need_build == 'true' && success()
        run: |
          echo "${{ steps.get-latest.outputs.sha }}" > .last_build_sha
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add .last_build_sha
          git commit -m "chore: update build record to ${{ steps.get-latest.outputs.sha }}" || echo "No changes to commit"
          git push

      - name: 构建完成通知
        if: steps.check-update.outputs.need_build == 'true' && success()
        run: |
          echo ""
          echo "╔════════════════════════════════════════╗"
          echo "║        ✅ 构建成功完成！               ║"
          echo "╠════════════════════════════════════════╣"
          echo "║ 应用名称: ${{ env.APP_NAME }}"
          echo "║ 版本标签: ${{ steps.version.outputs.tag_name }}"
          echo "║ 架构:     arm64-v8a"
          echo "║ Commit:   ${{ steps.get-latest.outputs.sha }}"
          echo "╚════════════════════════════════════════╝"
          echo ""

      - name: 无更新通知
        if: steps.check-update.outputs.need_build != 'true'
        run: |
          echo ""
          echo "╔════════════════════════════════════════╗"
          echo "║     ℹ️  未检测到 PiliPlus 更新        ║"
          echo "╠════════════════════════════════════════╣"
          echo "║ 当前 SHA: ${{ steps.get-latest.outputs.sha }}"
          echo "║ 跳过本次构建"
          echo "╚════════════════════════════════════════╝"
          echo ""
