name: Build PiliPlus APK

on:
  schedule:
    - cron: '0 0 * * *'
  workflow_dispatch:

env:
  SOURCE_REPO: bggRGjQaUbCoE/PiliPlus
  TARGET_REPO: lm317379829/build-Pili
  APP_NAME: 哔哩哔哩
  KEEP_COUNT: 3

jobs:
  check-and-build:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      actions: write

    steps:
      - name: 检出本仓库
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: 获取 PiliPlus 最新 commit SHA
        id: get-latest
        run: |
          LATEST_SHA=$(curl -s "https://api.github.com/repos/${{ env.SOURCE_REPO }}/commits/main" | jq -r '.sha')
          echo "sha=$LATEST_SHA" >> $GITHUB_OUTPUT
          echo "最新 commit SHA: $LATEST_SHA"

      - name: 检查是否需要构建
        id: check-update
        run: |
          if [ -f .last_build_sha ]; then
            LAST_SHA=$(cat .last_build_sha)
            echo "上次构建的 SHA: $LAST_SHA"
            if [ "$LAST_SHA" = "${{ steps.get-latest.outputs.sha }}" ]; then
              echo "没有检测到更新，跳过构建"
              echo "need_build=false" >> $GITHUB_OUTPUT
            else
              echo "检测到更新！"
              echo "need_build=true" >> $GITHUB_OUTPUT
            fi
          else
            echo "首次构建"
            echo "need_build=true" >> $GITHUB_OUTPUT
          fi

      - name: 检出 PiliPlus 源码
        if: steps.check-update.outputs.need_build == 'true'
        uses: actions/checkout@v4
        with:
          repository: ${{ env.SOURCE_REPO }}
          path: pilipalus-source
          fetch-depth: 0

      - name: 设置 Java 环境
        if: steps.check-update.outputs.need_build == 'true'
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'
          cache: 'gradle'
          cache-dependency-path: |
            pilipalus-source/android/*.gradle*
            pilipalus-source/android/**/gradle-wrapper.properties

      - name: 安装 Flutter
        if: steps.check-update.outputs.need_build == 'true'
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          flutter-version-file: 'pilipalus-source/pubspec.yaml'
          cache: true

      - name: 安装 ImageMagick
        if: steps.check-update.outputs.need_build == 'true'
        run: sudo apt-get update && sudo apt-get install -y imagemagick

      - name: 复制自定义图标并生成所有分辨率图标
        if: steps.check-update.outputs.need_build == 'true'
        run: |
          if [ -f "assets/icon.png" ]; then
            echo "找到自定义图标，正在处理..."
            
            # 创建 drawable 目录（代替 drawable-v21，通用性最强）
            mkdir -p pilipalus-source/android/app/src/main/res/drawable
            
            # 创建 mipmap 目录
            for density in mdpi hdpi xhdpi xxhdpi xxxhdpi; do
              mkdir -p "pilipalus-source/android/app/src/main/res/mipmap-$density"
            done
            
            # 图标尺寸映射
            declare -A SIZES=( ["mdpi"]=48 ["hdpi"]=72 ["xhdpi"]=96 ["xxhdpi"]=144 ["xxxhdpi"]=192 )
            
            # 生成 mipmap 图标
            for density in "${!SIZES[@]}"; do
              size="${SIZES[$density]}"
              convert assets/icon.png -resize ${size}x${size} "pilipalus-source/android/app/src/main/res/mipmap-$density/ic_launcher.png"
              echo "生成 mipmap-$density/ic_launcher.png (${size}x${size})"
            done
            
            # 生成自适应图标背景（完整图标限制在 60% 黄金安全区，透明填充至 288x288）
            convert assets/icon.png -resize 172x172 -background transparent -gravity center -extent 288x288 \
              pilipalus-source/android/app/src/main/res/drawable/ic_launcher_background.png
            echo "生成 drawable/ic_launcher_background.png (288x288, 60% 主体安全边距)"
            
            # 生成透明的前景图标 (108x108)
            convert -size 108x108 xc:transparent pilipalus-source/android/app/src/main/res/drawable/ic_launcher_foreground.png
            echo "生成 drawable/ic_launcher_foreground.png (108x108)"
            
            # 修改自适应图标 XML 文件，将背景指向刚生成的 drawable 图片，而非颜色
            XML_FILE="pilipalus-source/android/app/src/main/res/mipmap-anydpi-v26/ic_launcher.xml"
            if [ -f "$XML_FILE" ]; then
              sed -i 's|@color/ic_launcher_background|@drawable/ic_launcher_background|g' "$XML_FILE"
              echo "✅ 已修改 $XML_FILE 中的背景为 drawable"
            fi
            
            # 复制到 assets/logo 目录
            cp assets/icon.png pilipalus-source/assets/images/logo/logo_2.png
            cp assets/icon.png pilipalus-source/assets/images/logo/logo.png
            
            echo "✅ 图标处理完成"
          else
            echo "⚠️ 警告: 未找到自定义图标 assets/icon.png，将使用默认图标"
          fi

      - name: 修改应用名称
        if: steps.check-update.outputs.need_build == 'true'
        run: |
          STRINGS_FILE="pilipalus-source/android/app/src/main/res/values/string.xml"
          mkdir -p "$(dirname "$STRINGS_FILE")"
          cat > "$STRINGS_FILE" << 'XMLEOF'
          <?xml version="1.0" encoding="utf-8"?>
          <resources>
              <string name="app_name">哔哩哔哩</string>
              <string name="search">搜索</string>
              <string name="offline_video">离线视频</string>
          </resources>
          XMLEOF
          echo "✅ 应用名称已修改为: ${{ env.APP_NAME }}"

      - name: 修改更新检查链接指向本仓库
        if: steps.check-update.outputs.need_build == 'true'
        run: |
          echo "修改更新检查 API 指向本仓库..."
          
          # 修改 api.dart 中的 latestApp URL
          sed -i "s|https://api.github.com/repos/bggRGjQaUbCoE/PiliPlus/releases|https://api.github.com/repos/${{ env.TARGET_REPO }}/releases|g" \
            pilipalus-source/lib/http/api.dart
          
          # 验证修改
          grep "latestApp" pilipalus-source/lib/http/api.dart
          echo "✅ 更新检查 API 已修改"

      - name: 获取版本信息
        if: steps.check-update.outputs.need_build == 'true'
        id: version
        run: |
          cd pilipalus-source
          VERSION=$(grep '^version:' pubspec.yaml | sed 's/version: //' | cut -d'+' -f1 | tr -d '\r' | tr -d ' ')
          VERSION_CODE=$(grep '^version:' pubspec.yaml | sed 's/version: //' | cut -d'+' -f2 | tr -d '\r' | tr -d ' ')
          BUILD_DATE=$(date +%Y%m%d)
          TAG_NAME="v${VERSION}"
          echo "version=$VERSION" >> $GITHUB_OUTPUT
          echo "version_code=$VERSION_CODE" >> $GITHUB_OUTPUT
          echo "tag_name=$TAG_NAME" >> $GITHUB_OUTPUT
          echo "build_date=$BUILD_DATE" >> $GITHUB_OUTPUT
          echo "版本: $VERSION | 标签: $TAG_NAME"

      - name: 配置编译版本与 Commit Hash 信息
        if: steps.check-update.outputs.need_build == 'true'
        run: |
          BUILD_TIME_MS=$(date +%s000)
          cat > pilipalus-source/lib/build_config.dart << EOF
          abstract final class BuildConfig {
            static const int versionCode = ${{ steps.version.outputs.version_code }};
            static const String versionName = '${{ steps.version.outputs.version }}';
            static const int buildTime = $BUILD_TIME_MS;
            static const String commitHash = '${{ steps.get-latest.outputs.sha }}';
          }
          EOF
          echo "✅ build_config.dart 注入成功，时间戳: $BUILD_TIME_MS，Hash: ${{ steps.get-latest.outputs.sha }}"
          cat pilipalus-source/lib/build_config.dart

      - name: 安装依赖
        if: steps.check-update.outputs.need_build == 'true'
        run: |
          cd pilipalus-source
          flutter pub get

      - name: 构建 APK (arm64-v8a)
        if: steps.check-update.outputs.need_build == 'true'
        run: |
          cd pilipalus-source
          flutter build apk --release --split-per-abi --target-platform android-arm64
          APK_NAME="${{ env.APP_NAME }}_${{ steps.version.outputs.tag_name }}_arm64-v8a.apk"
          mv build/app/outputs/flutter-apk/app-arm64-v8a-release.apk "$APK_NAME"
          echo "✅ APK 构建完成: $APK_NAME"
          ls -lh "$APK_NAME"

      - name: 发布 Release
        if: steps.check-update.outputs.need_build == 'true'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.version.outputs.tag_name }}
          name: "${{ env.APP_NAME }} ${{ steps.version.outputs.tag_name }}"
          body: |
            ## 📱 构建信息

            | 项目 | 值 |
            |------|-----|
            | 源仓库 | ${{ env.SOURCE_REPO }} |
            | Commit | `${{ steps.get-latest.outputs.sha }}` |
            | 构建日期 | ${{ steps.version.outputs.build_date }} |
            | 应用名称 | ${{ env.APP_NAME }} |
            | 架构 | arm64-v8a |

            ## 📝 说明

            基于 [PiliPlus](${{ env.SOURCE_REPO }}) 最新版本构建，包含：
            - ✅ 自定义应用图标
            - ✅ 自定义应用名称：${{ env.APP_NAME }}
            - ✅ 仅 arm64-v8a 架构（适用于大多数现代 Android 设备）
            - ✅ 更新检查指向本仓库
          files: |
            pilipalus-source/${{ env.APP_NAME }}_${{ steps.version.outputs.tag_name }}_arm64-v8a.apk
          draft: false
          prerelease: false

      - name: 清理旧 Release
        if: steps.check-update.outputs.need_build == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          echo "开始清理旧 Release，保留最近 ${{ env.KEEP_COUNT }} 个..."
          RELEASES=$(curl -s -H "Authorization: token ${{ secrets.GITHUB_TOKEN }}" \
            "https://api.github.com/repos/${{ github.repository }}/releases" \
            | jq -r '.[].tag_name')
          COUNT=0
          for tag in $RELEASES; do
            COUNT=$((COUNT + 1))
            if [ $COUNT -gt ${{ env.KEEP_COUNT }} ]; then
              echo "删除旧 Release: $tag"
              curl -s -X DELETE \
                -H "Authorization: token ${{ secrets.GITHUB_TOKEN }}" \
                "https://api.github.com/repos/${{ github.repository }}/releases/tags/$tag"
              echo "删除旧 Tag: $tag"
              curl -s -X DELETE \
                -H "Authorization: token ${{ secrets.GITHUB_TOKEN }}" \
                "https://api.github.com/repos/${{ github.repository }}/git/refs/tags/$tag"
            fi
          done
          echo "✅ Release 清理完成"

      - name: 清理旧 Action Run
        if: steps.check-update.outputs.need_build == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          echo "开始清理旧 Action Run，保留最近 ${{ env.KEEP_COUNT }} 个..."
          RUNS=$(curl -s -H "Authorization: token ${{ secrets.GITHUB_TOKEN }}" \
            "https://api.github.com/repos/${{ github.repository }}/actions/workflows/build-pilipalus.yml/runs?per_page=100" \
            | jq -r '.workflow_runs[] | select(.status == "completed") | .id')
          COUNT=0
          for run_id in $RUNS; do
            COUNT=$((COUNT + 1))
            if [ $COUNT -gt ${{ env.KEEP_COUNT }} ]; then
              echo "删除旧 Action Run: $run_id"
              curl -s -X DELETE \
                -H "Authorization: token ${{ secrets.GITHUB_TOKEN }}" \
                "https://api.github.com/repos/${{ github.repository }}/actions/runs/$run_id"
            fi
          done
          echo "✅ Action Run 清理完成"

      - name: 更新构建记录
        if: steps.check-update.outputs.need_build == 'true'
        run: |
          echo "${{ steps.get-latest.outputs.sha }}" > .last_build_sha
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add .last_build_sha
          git commit -m "chore: update build record to ${{ steps.get-latest.outputs.sha }}" || echo "No changes to commit"
          git push

      - name: 构建完成通知
        if: steps.check-update.outputs.need_build == 'true'
        run: |
          echo ""
          echo "╔════════════════════════════════════════╗"
          echo "║        ✅ 构建成功完成！               ║"
          echo "╠════════════════════════════════════════╣"
          echo "║ 应用名称: ${{ env.APP_NAME }}"
          echo "║ 版本标签: ${{ steps.version.outputs.tag_name }}"
          echo "║ 架构:     arm64-v8a"
          echo "║ Commit:   ${{ steps.get-latest.outputs.sha }}"
          echo "╚════════════════════════════════════════╝"
          echo ""

      - name: 无更新通知
        if: steps.check-update.outputs.need_build != 'true'
        run: |
          echo ""
          echo "╔════════════════════════════════════════╗"
          echo "║     ℹ️  未检测到 PiliPlus 更新        ║"
          echo "╠════════════════════════════════════════╣"
          echo "║ 当前 SHA: ${{ steps.get-latest.outputs.sha }}"
          echo "║ 跳过本次构建"
          echo "╚════════════════════════════════════════╝"
          echo ""
